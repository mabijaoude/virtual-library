services:
  web:
    build:
      context: .
      target: web
    image: ${IMAGE_REF:-virtual-library:dev}
    container_name: ${COMPOSE_PROJECT_NAME:-virtual-library}-web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5587}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

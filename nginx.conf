server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header_inherit merge;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_static on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types application/json application/javascript application/wasm text/css text/plain text/markdown image/svg+xml;

  location /book-metadata/ {
    add_header Cache-Control "private, max-age=3600, stale-while-revalidate=86400";
    try_files $uri =404;
  }

  location = /library-manifest.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /library-search-manifest.json {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  location /library-search-shards/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /book-content/ {
    default_type text/markdown;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /worlds/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /worlds/previews/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /basis/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
